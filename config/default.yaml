camera:
  type: orbbec_gemini2
  serial: null
  color_width: 1280
  color_height: 720
  fps: 30

calibration:
  aruco:
    marker_length_m: 0.1
    dict_id: 0
    target_marker_id: 0
  hand_eye_method: TSAI
  hand_eye_compensation_m:
    x: -0.02
    y: 0.0
    z: 0.015

detection:
  conf_threshold: 0.15
  iou_threshold: 0.45

robot:
  repo_root: null
  gripper:
    dm:
      angle_open: 5.0
      counterclockwise: true
      tau_max: 1.5
      close_torque: 1.0
      default_force: 0.30
    rs:
      angle_open: 5.0
      counterclockwise: false
      tau_max: 1.5
      # close_torque: 1.5
      close_torque: 1.5
      default_force: 0.5
  ready_pose:
    x: 0.3
    y: 0.0
    z: 0.3
    roll: 0.0
    pitch: 0.7
    duration: 3.0

yolo:
  model_name: "yoloe-26l-seg.pt"
  device: "cuda:0"
  use_world: true
  custom_classes:
    - "red block"
    - "red cube"
    - "red square"
    - "red lego"
    - "red toy"
    - "toy"
    - "box"
    - "container"
    - "tray"
    - "bowl"
    - "silver plate"
    - "metal container"
    - "yellow banana"
    - "water bottle"
    - "light blue coffee cup"
    - "cup"
    - "green object"
    - "tool"

grasp_pipeline:
  infer_every_live: 3
  grasp:
    # 可选 graspnet / anygrasp；命令行 --estimator 可覆盖此值。
    estimator: anygrasp
    depth_quantile: 0.5
    pregrasp_offset_m: 0.080
    # insertion_depth_m: 0.015
    insertion_depth_m: 0.02
    min_base_z_m: 0.01

graspnet:
  checkpoint: "/home/tony/wey/rebot_developer/rebot_grasp/sdk/graspnet-baseline/checkpoints/checkpoint-rs.tar"
  num_point: 20000
  collision_thresh: 0.01
  min_depth: 0.05
  max_depth: 1.0
  top_k: 50
  target_class: null
  target_margin_px: 12
  target_expand_ratio: 1.35


# AnyGrasp（2026-07 之后的新版 SDK：create_detector + steering 参数）
# 权重、gsnet.so 和本机 license 不随源码分发，安装步骤见 AnyGrasp升级操作手册.md。
anygrasp:
  sdk_root: "/home/tony/wey/rebot_developer/rebot_grasp/sdk/anygrasp_sdk"
  checkpoint: "log/checkpoint_detection.tar"  # 相对于 grasp_detection/
  # 与 drivers/robot/grasp_driver.py 的 GRIPPER_MAX_DISTANCE_M=0.09 对齐。
  max_gripper_width: 0.09
  # 碰撞模型的手指高度；沿用 SDK 默认初值，真机前按夹爪模型复核。
  gripper_height: 0.03

  min_depth: 0.05
  max_depth: 1.0
  max_input_points: 100000
  point_seed: 0
  min_region_points: 300
  dense_grasp: false
  collision_detection: true  # 代码强制 true，不允许为真机关闭
  score_threshold: 0.0       # 先观察原始分数分布，再用 A/B 数据调整
  top_k: 20
  target_margin_px: 12
  target_expand_ratio: 1.35

  # 第一阶段保守限制：只取接近竖直向下的候选。base 系还会再检查一次。
  # 相机-only 无机械臂位姿时使用 [0,0,1]（Gemini 2 光轴朝下指向桌面）。
  preferred_approach_cam: [0.0, 0.0, 1.0]
  approach_thresh_deg: 45.0

  # 相机系区域：结合实拍点云调整，排除机械臂本体、支架和桌外背景。
  lims: [-0.25, 0.25, -0.25, 0.25, 0.10, 0.80]

  safety:
    width_margin_m: 0.003
    max_tilt_deg: 45.0
    downward_base: [0.0, 0.0, -1.0]
    # 保守初始 base 工作区（米），不是通用标定值；按桌面和臂展复核。
    # pregrasp、grasp、retreat、最终指尖和抓取中心都必须落在范围内。
    base_workspace_min: [0.10, -0.25, 0.01]
    base_workspace_max: [0.6,  0.25, 0.45]  # dry-run 阶段性扩展；真机前按可达性复核


# AnyGrasp 抓取放置
place:
  container_class: "box"

  # base 坐标系下的 TCP 释放高度，不是相对容器底部的距离
  height_m: 0.15

  # 先到容器上方预放置点，再下降 8 cm 到释放点
  pre_place_offset_m: 0.08

  # 固定放置姿态，沿用原 OBB 放置程序的朝向
  # orientation_rpy: [0.0, 1.2, 0.0]
  orientation_rpy: [0.0, 0.7, 0.0]

  # 容器掩膜有效深度的分位数；容器 XY 使用检测框中心
  container_depth_quantile: 0.5

  # 保守慢速轨迹
  pregrasp_duration_s: 2.0
  grasp_duration_s: 1.5
  retreat_duration_s: 2.0
  ready_duration_s: 2.5
  pre_place_duration_s: 2.5
  place_duration_s: 1.05
  release_wait_s: 1.0